<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qing Plans</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: light-dark(#f3f5f7, #0f1318);
      --surface: light-dark(#fff, #181e24);
      --soft: light-dark(#f7f9fb, #20272f);
      --ink: light-dark(#17202a, #edf2f5);
      --muted: light-dark(#657281, #9da8b3);
      --line: light-dark(#dfe5ea, #323b45);
      /* Brand: logo mark + selection chrome only */
      --brand: light-dark(#176b62, #69cebf);
      --brand-soft: light-dark(#e5f3f0, #173934);
      /* Neutral accent: pills, hero surfaces (not status, not impact) */
      --accent: light-dark(#3d4a57, #c5d0da);
      --accent-soft: light-dark(#eef1f4, #252d36);
      /* Task lifecycle status */
      --blue: light-dark(#4f5fd1, #8b97f5);
      --amber: light-dark(#b8823a, #e0b36a);
      --green: light-dark(#2e9e5b, #68cf89);
      --red: light-dark(#c4463f, #ff8585);
      --red-soft: light-dark(#fceaea, #432020);
      /* Module impact (separate hue from status) */
      --impact: light-dark(#7b4fd1, #b794f6);
      --impact-soft: light-dark(#f3edfc, #2a1f3d);
      --impact-mid: light-dark(#a78bda, #7a5fb0);
      --shadow: light-dark(0 18px 50px rgb(28 40 54 / 13%), 0 20px 58px rgb(0 0 0 / 34%));
    }
    /* Manual theme override: light-dark() resolves against the used color-scheme,
       so forcing it here beats the OS/browser preference until the user picks "auto". */
    html.theme-light { color-scheme: light; }
    html.theme-dark { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    button, select { color: inherit; font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1440px, calc(100% - 28px)); margin: 20px auto; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
    .appbar, .plan-head, .panel-head, .module-top, .footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .appbar { padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: var(--brand); color: var(--surface); font-weight: 800; }
    .brand-name { font-weight: 700; }
    .path, .muted, .meta { color: var(--muted); }
    .path, .meta { font-size: 12px; }
    .actions { display: flex; gap: 9px; }
    select, .button { min-height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 7px 10px; }
    .button:hover { background: var(--soft); }
    .button[aria-pressed="true"] { color: var(--surface); background: var(--ink); border-color: var(--ink); }
    .content { background: var(--canvas); }
    .tier-hero { background: var(--surface); }
    .tier-standard { background: var(--surface); }
    .tier-detail { background: var(--surface); color: var(--muted); }
    .tier-detail h2 { color: var(--ink); font-size: 14px; }
    .tier-detail details { margin: 0; }
    .tier-detail summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 19px; border-bottom: 1px solid transparent; }
    .tier-detail summary::-webkit-details-marker { display: none; }
    .tier-detail summary::after { content: "›"; color: var(--muted); transition: transform .15s; font-size: 16px; }
    .tier-detail details[open] > summary { border-bottom-color: var(--line); }
    .tier-detail details[open] > summary::after { transform: rotate(90deg); }
    .tier-detail .detail-body { padding: 0 19px 18px; }
    .handoff { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); background: var(--surface); }
    .handoff .lead { min-width: 0; padding: 18px 20px 14px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
    .handoff .lead .handoff-value { margin-top: 6px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.3; }
    .handoff-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); }
    .handoff-meta > div { min-width: 0; padding: 10px 17px; background: var(--surface); }
    .eyebrow { color: var(--brand); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .handoff-value { margin-top: 4px; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    .handoff-note { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .portable, .local-only, .portability-unknown { color: var(--ink); font-weight: 650; }
    .portable::before { content: "✓ "; }
    .local-only::before { content: "⚠ "; }
    .portability-unknown::before { content: "· "; color: var(--muted); }
    .plan-head { align-items: flex-start; padding: 19px 20px 13px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .plan-head-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: flex-end; }
    h1 { margin: 3px 0 4px; font-size: 24px; line-height: 1.2; letter-spacing: -.025em; }
    .goal { max-width: 760px; color: var(--muted); }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 9px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 650; white-space: nowrap; }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .risk-badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 10px; background: var(--red-soft); color: var(--red); font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .risk-badge:hover { filter: brightness(0.97); }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-block: 1px solid var(--line); background: var(--surface); }
    .summary > div { padding: 12px 18px; }
    .summary > div + div { border-left: 1px solid var(--line); }
    .summary .issues-alert { background: var(--red-soft); }
    .summary .issues-alert .label, .summary .issues-alert .value { color: var(--red); }
    .label { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    .value { margin-top: 1px; font-size: 20px; font-weight: 650; }
    .tasks-section { padding: 17px 19px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .tasks-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .tasks-subhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .tasks-subhead h3 { margin: 0; font-size: 14px; }
    .tasks-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .view-toggle { display: flex; gap: 6px; }
    .tasks-actions button { min-height: 32px; padding: 6px 11px; border-radius: 8px; }
    .phase-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 12px; }
    .phase-scope { width: 100%; height: 100%; min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--soft); color: inherit; text-align: left; font: inherit; cursor: pointer; }
    .phase-scope:hover { background: var(--brand-soft); }
    .phase-scope[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
    .phase-scope-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .phase-scope-title { min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
    .phase-scope-count { flex-shrink: 0; color: var(--muted); font-size: 11px; }
    .phase-scope-relations { display: grid; gap: 3px; margin-top: 7px; font-size: 11.5px; }
    .phase-relation-label { color: var(--muted); }
    .phase-relation-arrow { color: var(--brand); font-weight: 750; }
    .phase-graph-section { margin-top: 12px; }
    .graph-section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
    .graph-section-title strong { font-size: 13px; }
    .phase-graph-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--canvas); }
    .phase-graph-wrap svg { width: auto; min-width: 560px; max-width: none; margin-inline: auto; }
    .phase-node { cursor: pointer; outline: none; }
    .phase-node rect { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; rx: 10; }
    .phase-node text { fill: var(--ink); pointer-events: none; }
    .phase-node .node-index, .phase-node .node-meta, .phase-node .node-relations { fill: var(--muted); font-size: 10.5px; }
    .phase-node .node-title { font-size: 13px; font-weight: 700; }
    .phase-node.complete rect { stroke: var(--green); }
    .phase-node.selected rect, .phase-node:focus rect { stroke: var(--brand); stroke-width: 3; fill: var(--brand-soft); }
    .phase-edge { fill: none; stroke: color-mix(in srgb, var(--brand) 72%, var(--muted)); stroke-width: 2; }
    .phase-task-graphs { display: grid; min-width: 0; gap: 12px; margin-top: 12px; }
    .phase-task-graph { min-width: 0; max-width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
    .phase-task-graph.selected { border-color: var(--brand); }
    .phase-task-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .phase-task-title { font-weight: 700; }
    .phase-task-boundary { margin-top: 3px; color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
    .phase-task-graph .task-graph-wrap { background: var(--surface); }
    .phase-task-graph .task-graph-wrap svg { width: auto; min-width: 420px; max-width: none; margin-inline: auto; }
    .phase-list { display: grid; gap: 8px; margin-top: 12px; }
    .phase-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
    .phase-summary { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: none; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .phase-summary:hover { background: var(--soft); }
    .phase-summary-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .phase-order { color: var(--muted); font-size: 12px; flex-shrink: 0; }
    .phase-title { font-weight: 650; overflow-wrap: anywhere; }
    .phase-summary-meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .phase-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .chevron { color: var(--muted); transition: transform .15s; }
    .phase-card.open .chevron { transform: rotate(90deg); }
    .phase-body { border-top: 1px solid var(--line); }
    .task-row { display: grid; grid-template-columns: minmax(0, 1.3fr) 108px minmax(0, 1.1fr); gap: 12px; padding: 11px 14px; }
    .task-row + .task-row { border-top: 1px solid var(--line); }
    .task-title { font-weight: 650; overflow-wrap: anywhere; }
    .task-purpose { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .task-deps, .task-files { font-size: 12px; color: var(--muted); }
    .task-deps + .task-deps { margin-top: 3px; }
    .state-done, .state-ready { color: var(--green); }
    .state-in-progress { color: var(--blue); }
    .state-blocked, .state-not-started { color: var(--amber); }
    .state-failed { color: var(--red); }
    .task-graph-wrap { width: 100%; max-width: 100%; margin-top: 12px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--canvas); }
    .task-graph-meta { display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 14px 0; color: var(--muted); font-size: 12px; }
    .task-legend { display: flex; flex-wrap: wrap; gap: 13px; padding: 7px 14px 11px; color: var(--muted); font-size: 11.5px; }
    .task-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend-key { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 3px; }
    .legend-key.ready, .legend-key.done { color: var(--green); }
    .legend-key.in-progress { color: var(--blue); }
    .legend-key.blocked { color: var(--amber); }
    .legend-key.failed { color: var(--red); }
    .legend-key.current { color: var(--line); box-shadow: 0 0 0 2px var(--ink); }
    .task-node { cursor: pointer; transition: opacity .15s; outline: none; }
    .task-node:focus rect { stroke: var(--ink); stroke-width: 3; }
    .task-node.scope-related { opacity: .72; }
    .task-node.scope-muted { opacity: .28; }
    .task-node.selected rect { stroke: var(--brand); stroke-width: 3; }
    .task-node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; rx: 8; }
    .task-node text { fill: var(--ink); pointer-events: none; }
    .task-node .node-id { fill: var(--muted); font-size: 9.5px; }
    .task-node .node-title { font-size: 11.5px; font-weight: 700; }
    .task-node .node-meta { fill: var(--muted); font-size: 10.5px; }
    .task-node .node-status { font-size: 10.5px; font-weight: 700; }
    .task-node.done rect, .task-node.ready rect { stroke: var(--green); }
    .task-node.done .node-status, .task-node.ready .node-status { fill: var(--green); }
    .task-node.in-progress rect { stroke: var(--blue); }
    .task-node.in-progress .node-status { fill: var(--blue); }
    .task-node.blocked rect, .task-node.not-started rect { stroke: var(--amber); stroke-dasharray: 5 3; }
    .task-node.blocked .node-status, .task-node.not-started .node-status { fill: var(--amber); }
    .task-node.failed rect { stroke: var(--red); }
    .task-node.failed .node-status { fill: var(--red); }
    .task-node.current rect { stroke-width: 3; }
    .task-node.selected rect { stroke: var(--brand); stroke-width: 3; fill: var(--brand-soft); }
    .task-edge { fill: none; stroke: color-mix(in srgb, var(--muted) 58%, transparent); stroke-width: 1.5; transition: opacity .15s; }
    .task-edge.scope-related { opacity: .72; }
    .task-edge.scope-muted { opacity: .2; }
    .task-edge.blocked { stroke: var(--amber); stroke-dasharray: 5 4; }
    .task-detail { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); outline: none; }
    .task-detail:focus { box-shadow: inset 0 0 0 2px var(--brand); }
    .task-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .task-detail-title { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
    .task-detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .task-detail-block { min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow-wrap: anywhere; }
    .task-detail-block.wide { grid-column: span 2; }
    .task-detail-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(340px, .75fr); align-items: start; min-height: 0; border-bottom: 1px solid var(--line); }
    .map-panel, .detail-panel, .section { padding: 17px 19px 20px; }
    .map-panel, .detail-panel { min-width: 0; }
    .detail-panel { border-left: 1px solid var(--line); background: var(--soft); }
    h2 { margin: 0; font-size: 15px; }
    .map-wrap { margin-top: 12px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--canvas); }
    .map-wrap svg { width: auto; min-width: 600px; max-width: none; margin-inline: auto; }
    .module-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 300px)); gap: 9px; margin-top: 12px; }
    .module-card { min-width: 0; padding: 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: inherit; text-align: left; font: inherit; cursor: pointer; }
    .module-card:hover { background: var(--soft); }
    .module-card[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
    .module-card-name { font-weight: 700; overflow-wrap: anywhere; }
    .module-card-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .scope-control { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .scope-pill { display: inline-flex; max-width: min(520px, 55vw); padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 650; overflow-wrap: anywhere; }
    .scope-reset { min-height: 26px; padding: 3px 9px; font-size: 11px; }
    svg { display: block; min-width: 720px; width: 100%; }
    .edge { stroke: color-mix(in srgb, var(--muted) 58%, transparent); stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .node { cursor: pointer; }
    .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; rx: 10; }
    .node text { fill: var(--ink); pointer-events: none; }
    .node .node-meta { fill: var(--muted); font-size: 11px; }
    .node.changed rect { fill: var(--impact-soft); stroke: var(--impact); }
    .node.affected rect { fill: var(--surface); stroke: var(--impact-mid); stroke-dasharray: 4 3; }
    .node.selected rect { stroke: var(--brand); stroke-width: 3; }
    .legend { display: flex; flex-wrap: wrap; gap: 13px; padding-top: 9px; color: var(--muted); font-size: 12px; }
    .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 1px solid currentColor; border-radius: 3px; }
    .changed-key { color: var(--impact); } .affected-key { color: var(--impact-mid); }
    .module-name { font-size: 19px; font-weight: 650; }
    .module-detail-grid { display: grid; grid-template-columns: 1fr; }
    .module-block { padding: 11px 0; border-top: 1px solid var(--line); }
    .module-block.scope-reason { color: var(--ink); font-weight: 550; }
    .module-files { max-height: 220px; overflow: auto; }
    .relations { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .relation { padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .chip { padding: 2px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 11px; }
    .section { background: var(--surface); border-bottom: 1px solid var(--line); }
    .pill.impact-changed { background: var(--impact-soft); color: var(--impact); }
    .pill.impact-affected { background: var(--soft); color: var(--impact-mid); }
    .table-wrap { margin-top: 10px; overflow: auto; border: 1px solid var(--line); border-radius: 11px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { padding: 8px 10px; background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 550; text-align: left; }
    td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; font-size: 12px; overflow-wrap: anywhere; }
    code { color: inherit; font-size: 11px; }
    .status { display: inline-flex; align-items: center; gap: 5px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .verified { color: var(--green); } .observed { color: var(--blue); } .pending { color: var(--amber); } .failed { color: var(--red); } .mismatched { color: var(--red); }
    .audit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
    .audit-card { padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
    .audit-card + .audit-card { margin-top: 7px; }
    .footer { padding: 11px 18px; color: var(--muted); font-size: 11px; background: var(--soft); }
    .empty, .error { padding: 28px; color: var(--muted); text-align: center; }
    .error { color: var(--red); }
    .task-graph-hint { display: none; }
    @media (max-width: 900px) {
      .handoff-meta { grid-template-columns: 1fr 1fr; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .summary > div:nth-child(odd) { border-left: 0; }
      .workspace { display: block; }
      .detail-panel { border-top: 1px solid var(--line); border-left: 0; }
      .task-detail-grid, .module-detail-grid { grid-template-columns: 1fr; }
      .task-detail-block.wide, .module-files { grid-column: auto; }
    }
    @media (max-width: 620px) {
      .shell { width: 100%; margin: 0; border-radius: 0; }
      .appbar, .plan-head, .footer { align-items: stretch; flex-direction: column; }
      .plan-head-actions { justify-content: flex-start; }
      .actions, select { width: 100%; }
      .handoff-meta, .audit-grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: 1fr 1fr; }
      .map-panel, .detail-panel, .section, .tasks-section, .tier-detail summary, .tier-detail .detail-body { padding-inline: 13px; }
      .task-row { grid-template-columns: 1fr; }
      .tasks-actions, .view-toggle { width: 100%; }
      .tasks-actions > button, .view-toggle button { flex: 1; }
      .phase-overview { display: flex; overflow-x: auto; scroll-snap-type: x proximity; }
      .phase-overview > [role="listitem"] { flex: 0 0 280px; max-width: 82vw; scroll-snap-align: start; }
      .task-graph-hint { display: block; color: var(--muted); font-size: 11.5px; padding: 8px 14px 0; }
      .handoff .lead .handoff-value { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="appbar">
      <div class="brand"><div class="brand-mark">Q</div><div><div class="brand-name">Qing Plans</div><div class="path">qing-plans/dashboard.html</div></div></div>
      <div class="actions"><select id="planSelect"></select><button class="button" id="globalToggle" aria-pressed="false"></button><button class="button" id="themeToggle"></button><button class="button" id="langToggle"></button></div>
    </header>
    <div id="app"><div class="empty" id="loading"></div></div>
    <footer class="footer"><span id="footerNote"></span><span id="generatedAt"></span></footer>
  </main>
  <script>

      const amendments = state.status.amendments || [], issues = [...(state.status.issues || []), ...(state.status.derivedIssues || [])];
      const open = openIssueCount() > 0;
      const cards = (values, kind) => values.map(value => `<article class="audit-card"><strong>${esc(value.id || value.type)}</strong> · ${esc(value.status || value.severity || '')}<div>${esc(value.reason || value.title || value.detail || '')}</div><div class="meta">${kind === 'amendment' ? `${esc(value.kind)} · ${(value.operations || []).length} operations` : esc(value.nextAction || value.itemId || '')}</div></article>`).join('') || `<div class="muted">${esc(t('none'))}</div>`;
      return `<section class="section tier-detail" id="audit-section"><details${open ? ' open' : ''}><summary><div><h2>${esc(t('auditTitle'))}</h2><div class="meta">${esc(t('jumpToAudit'))}</div></div></summary><div class="detail-body"><div class="audit-grid"><div><div class="label">${esc(t('amendmentsLabel'))}</div>${cards(amendments, 'amendment')}</div><div><div class="label">${esc(t('issuesWarningsLabel'))}</div>${cards(issues, 'issue')}</div></div></div></details></section>`;
    }
    function renderWorkspace() {
      const s = state.status.summary || {};
      const impactMeta = t('moduleImpactMeta')(s.changedModules || 0, s.affectedModules || 0);
      return `<section class="workspace tier-standard"><div class="map-panel"><div class="panel-head"><div><h2>${state.global ? esc(t('globalGraph')) : esc(t('planScopedGraph'))}</h2><div class="meta">${esc(t('edgeHint'))} · ${esc(impactMeta)}</div></div><div class="scope-control"><span class="scope-pill">${esc(impactScopeLabel())}</span>${state.phase !== 'all' ? `<button class="button scope-reset" type="button" data-phase-scope-reset title="${esc(t('allPhaseImpact'))}">${esc(t('allPhases'))}</button>` : ''}</div></div>${renderGraph()}</div><aside class="detail-panel">${renderModuleDetail()}</aside></section>`;
    }
    function render() {
      const status = state.status;
      $('#app').innerHTML = `<div class="content">${renderPlanHead()}${renderHandoff()}${renderSummary()}${renderTasks()}${renderWorkspace()}${renderChanges()}${renderAudit()}</div>`;
      $('#generatedAt').textContent = `${t('snapshot')}${fmt(status.generatedAt)} · Map rev ${graphSource()?.revision ?? '—'}`;
      // Clicking a node in the Phase relationship graph zooms into that phase: it focuses
      // the graph, scopes the module impact map, and reveals that phase in the task list.
      const selectPhase = node => {
        const id = node.dataset.phaseToggle;
        state.focusedPhase = id;
        state.phase = state.phase === id ? 'all' : id;
        state.expandedPhase = id;
        state.selectedItem = null;
        render();
      };
      document.querySelectorAll('[data-phase-toggle]').forEach(node => {
        node.addEventListener('click', () => selectPhase(node));
        if (node.tagName !== 'BUTTON') node.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectPhase(node); }
        });
      });
      // "All phases" only widens the module impact map's scope; it never touches which
      // phase is expanded in the task list or focused in the task graph.
      document.querySelectorAll('[data-phase-scope-reset]').forEach(node => node.addEventListener('click', () => {
        state.phase = 'all';
        state.selectedItem = null;
        render();
      }));
      // The list accordion's own header only opens/closes that one card; it never
      // widens the impact scope back to "all" the way the Phase graph does.
      document.querySelectorAll('[data-phase-expand]').forEach(node => node.addEventListener('click', () => {
        const id = node.dataset.phaseExpand;
        state.expandedPhase = state.expandedPhase === id ? null : id;
        render();
      }));
      document.querySelectorAll('[data-item-view]').forEach(button => button.addEventListener('click', () => {
        state.itemView = button.dataset.itemView === 'graph' ? 'graph' : 'list';
        localStorage.setItem('qing-plans-item-view', state.itemView);
        render();
      }));
      const selectTaskNode = node => {
        const item = allItems().find(i => i.id === node.dataset.item);
        if (!item) return;
        state.selectedItem = item.id;
        state.focusedPhase = phaseIdOfItem(item.id);
        render();
        $('#taskDetail')?.focus();
      };
      document.querySelectorAll('[data-item]').forEach(node => {
        node.addEventListener('click', () => selectTaskNode(node));
        node.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectTaskNode(node); }
        });
      });
      document.querySelectorAll('[data-task-focus-phase]').forEach(button => button.addEventListener('click', () => { state.phase = button.dataset.taskFocusPhase; state.focusedPhase = state.phase; state.expandedPhase = state.phase; render(); }));
      document.querySelectorAll('[data-task-open-list]').forEach(button => button.addEventListener('click', () => { state.phase = button.dataset.taskOpenList; state.focusedPhase = state.phase; state.expandedPhase = state.phase; state.itemView = 'list'; render(); }));
      const selectModule = node => { state.selectedModule = node.dataset.module; render(); };
      document.querySelectorAll('[data-module]').forEach(node => {
        node.addEventListener('click', () => selectModule(node));
        node.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectModule(node); }
        });
      });
    }
    function applyTheme() {
      document.documentElement.classList.toggle('theme-light', state.theme === 'light');
      document.documentElement.classList.toggle('theme-dark', state.theme === 'dark');
      const label = {light: t('themeLight'), dark: t('themeDark'), auto: t('themeAuto')}[state.theme];
      $('#themeToggle').textContent = t('themeToggle')(label);
    }
    function applyChrome() {
      document.documentElement.lang = state.lang === 'en' ? 'en' : 'zh-CN';
      $('#planSelect').setAttribute('aria-label', t('selectPlanAria'));
      $('#globalToggle').textContent = t('globalToggle');
      $('#langToggle').textContent = t('langToggle');
      $('#footerNote').textContent = t('footerNote');
      applyTheme();
      const loading = $('#loading');
      if (loading) loading.textContent = t('loading');
    }
    async function loadPlan(slug) {
      state.status = await fetchJson(`${slug}/status.json`);
      // List view auto-opens only the current phase (others fold, click to expand);
      // graph view auto-focuses the same current phase. "All phases" is an explicit
      // opt-in via the button, not the default, so a large plan doesn't open fully expanded.
      state.phase = currentPhaseId() || 'all';
      state.focusedPhase = currentPhaseId() || state.status.phases?.[0]?.id || null;
      state.expandedPhase = state.focusedPhase;
      state.selectedItem = null;
      state.selectedModule = state.status.projectMap?.directModules?.[0] || state.status.projectMap?.modules?.[0]?.id || null;
      render();
    }
    async function init() {
      applyChrome();
      try {
        [state.index, state.map] = await Promise.all([fetchJson('index.json'), fetchJson('project-map.json')]);
        const select = $('#planSelect');
        select.innerHTML = state.index.plans.map(plan => `<option value="${esc(plan.slug)}">${esc(plan.name)} · ${esc(plan.state)}</option>`).join('');
        const initial = state.index.currentPlanSlug || state.index.plans.at(-1)?.slug;
        if (!initial) { $('#app').innerHTML = `<div class="empty">${esc(t('noPlans'))}</div>`; return; }
        select.value = initial;
        select.addEventListener('change', () => loadPlan(select.value).catch(showError));
        $('#globalToggle').addEventListener('click', event => { state.global = !state.global; event.currentTarget.setAttribute('aria-pressed', state.global); render(); });
        $('#themeToggle').addEventListener('click', () => {
          state.theme = {light: 'dark', dark: 'auto', auto: 'light'}[state.theme];
          localStorage.setItem('qing-plans-theme', state.theme);
          applyTheme();
        });
        $('#langToggle').addEventListener('click', () => {
          state.lang = state.lang === 'en' ? 'zh' : 'en';
          localStorage.setItem('qing-plans-lang', state.lang);
          applyChrome();
          if (state.status) render();
        });
        await loadPlan(initial);
      } catch (error) { showError(error); }
    }
    function showError(error) { $('#app').innerHTML = `<div class="error">${esc(t('loadError'))}${esc(error.message)}<br>${esc(t('loadErrorHint'))}</div>`; }
    init();
  </script>
</body>
</html>
